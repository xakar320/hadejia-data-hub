<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadejia Data Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.header{
background:linear-gradient(135deg,green,limegreen);
color:white;
padding:20px;
border-radius:15px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
background:green;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

.balance{
font-size:28px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
<h2>Hadejia Data Hub</h2>
<p>Wallet Balance</p>
<div class="balance" id="walletBalance">₦0</div>
</div>

<!-- VOICE -->
<div class="box">

<h3>Buy Voice Bundle</h3>

<select id="voiceNetwork" onchange="loadPlans()">
<option value="airtel">Airtel</option>
<option value="mtn">MTN</option>
</select>

<select id="voicePlan"></select>

<input id="phone" type="number" placeholder="Phone Number">

<button onclick="buyVoice()">Buy Voice</button>

</div>

<script>

/* =====================
SUPABASE
===================== */

const supabaseUrl =
"https://zjenhfapfhuoogxorung.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZW5oZmFwZmh1b29neG9ydW5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTkwNjMsImV4cCI6MjA5NjM3NTA2M30.Jymmb6ZACaR5r0Q5pYSVJzJIkqhkmera-Q7jVXvmaX0";

const client = supabase.createClient(supabaseUrl, supabaseKey);


/* =====================
SETTINGS (API + PIN)
===================== */

let API_KEY = "";
let API_PIN = "";

async function loadSettings(){

const { data } = await client
.from("settings")
.select("*")
.single();

if(data){
API_KEY = data.api_key;
API_PIN = data.api_pin;
}

}


/* =====================
LOGIN CHECK
===================== */

async function checkUser(){

const { data:{ session } } =
await client.auth.getSession();

if(!session){
window.location.href = "/";
}

}


/* =====================
VOICE PLANS
===================== */

const plans = {

airtel:[
{ name:"₦100", plan_id:"26117794", variation_code:"TalkMore_100" },
{ name:"₦300", plan_id:"26117796", variation_code:"TalkMore_300" },
{ name:"₦500", plan_id:"26117797", variation_code:"TalkMore_500" },
{ name:"₦1000", plan_id:"26117798", variation_code:"TalkMore_1000" },
{ name:"₦1500", plan_id:"26117799", variation_code:"TalkMore_1500" }
],

mtn:[
{ name:"₦120", plan_id:"400_7days", variation_code:"400_7days" },
{ name:"₦270", plan_id:"1000_7days", variation_code:"1000_7days" }
]

};


/* =====================
LOAD PLANS
===================== */

function loadPlans(){

let net = document.getElementById("voiceNetwork").value;
let sel = document.getElementById("voicePlan");

sel.innerHTML = "";

plans[net].forEach(p=>{
sel.innerHTML += `<option value="${p.plan_id}">${p.name}</option>`;
});

}

loadPlans();


/* =====================
BUY VOICE
===================== */

async function buyVoice(){

let net = document.getElementById("voiceNetwork").value;

let selected = plans[net].find(
p => p.plan_id == document.getElementById("voicePlan").value
);

let phone = document.getElementById("phone").value;

if(!phone || phone.length < 11){
alert("Invalid number");
return;
}

const res = await fetch(
"https://autosyncng.com/api/data/transfer",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + API_KEY
},
body:JSON.stringify({
request_ref:"REF_"+Date.now(),
mobile_number:phone,
product_id:net,
variation_code:selected.variation_code,
plan_id:selected.plan_id,
ported_no:false,
pin:API_PIN
})
}
);

const data = await res.json();

if(data.status=="ok"){
alert("Success 👍");
}else{
alert(data.message || "Failed");
}

}


/* =====================
INIT
===================== */

window.onload = async ()=>{
await loadSettings();
await checkUser();
loadPlans();
};

</script>

</body>
</html>

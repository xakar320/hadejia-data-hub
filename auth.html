<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hadejia Data Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f1f1f1;

width:100%;
min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.container{

width:100%;

max-width:450px;

background:white;

padding:40px 25px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,0.1);

}

h1{

text-align:center;

color:green;

font-size:45px;

margin-bottom:35px;

}

input{

width:100%;

height:60px;

border:2px solid #ddd;

border-radius:15px;

padding:15px;

font-size:20px;

margin-bottom:20px;

outline:none;

}

button{

width:100%;

height:60px;

border:none;

border-radius:15px;

font-size:28px;

font-weight:bold;

cursor:pointer;

margin-bottom:20px;

background:green;

color:white;

}

button:hover{

opacity:0.9;

}

p{

text-align:center;

font-size:18px;

color:#555;

margin-top:10px;

}

</style>

</head>

<body>

<div class="container">

<h1>Hadejia Data Hub</h1>

<input
type="text"
id="fullname"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

<p>
Secure Login System
</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://zjenhfapfhuoogxorung.supabase.co";

const supabaseKey =
"sb_publishable_PsygV812Dm2ORo2JcnhjzA_I_xbjqG4";

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);

async function register(){

const fullname =
document.getElementById(
"fullname"
).value;

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

if(!fullname || !email || !password){

alert("Please fill all fields");

return;

}

const { data, error } =
await client.auth.signUp({

email:email,

password:password,

options:{

data:{
full_name:fullname
}

}

});

if(error){

alert(error.message);

}else{

alert(
"Registration Successful"
);

}

}

async function login(){

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

if(!email || !password){

alert(
"Enter Email & Password"
);

return;

}

const { data, error } =
await client.auth.signInWithPassword({

email:email,

password:password

});

if(error){

alert(error.message);

}else{

alert("Login Successful");

window.location.href = "/";

}

}

</script>

</body>
</html>

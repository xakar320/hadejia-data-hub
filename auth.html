<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hadejia Data Hub Auth</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f2f2f2;
width:100%;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:green;
margin-bottom:25px;
font-size:32px;
}

input{
width:100%;
padding:16px;
margin-top:15px;
border:1px solid #ccc;
border-radius:12px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:16px;
margin-top:18px;
border:none;
border-radius:12px;
background:green;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.small{
text-align:center;
margin-top:15px;
font-size:15px;
color:#666;
}

</style>

</head>

<body>

<div class="card">

<h2>Hadejia Data Hub</h2>

<input
type="text"
id="fullname"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

<div class="small">
Secure Login System
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zjenhfapfhuoogxorung.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PsygV812Dm2ORo2JcnhjzA_I_xbjqG4";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* =========================
REGISTER
========================= */

async function register(){

const fullname =
document.getElementById(
"fullname"
).value;

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

if(
!fullname ||
!email ||
!password
){

alert("Fill all fields");

return;

}

const { data, error } =
await supabase.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:fullname
}
}

});

if(error){

alert(error.message);

}else{

alert(
"Registration Successful"
);

window.location.href =
"/";

}

}

/* =========================
LOGIN
========================= */

async function login(){

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

if(
!email ||
!password
){

alert("Enter Email & Password");

return;

}

const { data, error } =
await supabase.auth.signInWithPassword({

email:email,

password:password

});

if(error){

alert(error.message);

}else{

alert(
"Login Successful"
);

window.location.href =
"/";

}

}

</script>

</body>
</html>

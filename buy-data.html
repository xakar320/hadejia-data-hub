<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Buy Data | Hadejia Data Hub</title>

<link rel="stylesheet"
href="css/dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="container">

<!-- HEADER -->

<header class="header">

<div class="profile">

<h2>

Buy Data

</h2>

<p id="userName">

Loading...

</p>

</div>

<button
class="logoutBtn"
onclick="location.href='dashboard.html'">

← Dashboard

</button>

</header>

<!-- WALLET -->

<div class="walletCard">

<h3>

Wallet Balance

</h3>

<h1 id="walletBalance">

₦0

</h1>

</div>

<!-- BUY DATA -->

<div class="card">

<h2>

📶 Buy Data

</h2>

<label>

Network

</label>

<select id="network">

<option value="">

Select Network

</option>

<option value="MTN">

MTN

</option>

<option value="AIRTEL">

Airtel

</option>

<option value="GLO">

Glo

</option>

<option value="9MOBILE">

9Mobile

</option>

</select>

<br><br>

<label>

Data Plan

</label>

<select id="plan">

<option value="">

Select Plan

</option>

</select>

<br><br>

<label>

Phone Number

</label>

<input
type="tel"
id="phone"
placeholder="08012345678">

<br><br>

<button
id="buyBtn">

Buy Data

</button>

</div>

<!-- RESULT -->

<div class="card">

<h2>

Status

</h2>

<div id="result">

Waiting...

</div>

</div>

</div>

<script src="js/supabase.js"></script>

<script src="js/utils.js"></script>

<script src="js/buy-data.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Admin Panel

</title>

<link
rel="stylesheet"
href="css/style.css">

<style>

body{

background:#f5f7fb;

font-family:Arial,sans-serif;

margin:0;

padding:0;

}

header{

background:#2563eb;

color:#fff;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}

header h1{

margin:0;

font-size:24px;

}

header button{

background:#fff;

color:#2563eb;

border:none;

padding:10px 20px;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}

.container{

width:95%;

max-width:1300px;

margin:auto;

padding:20px;

}

.card{

background:#fff;

border-radius:15px;

padding:20px;

margin-bottom:20px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.card h2{

margin-top:0;

}

.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}

.stat-box{

background:#2563eb;

color:#fff;

padding:20px;

border-radius:15px;

text-align:center;

}

.stat-box h1{

margin:0;

font-size:35px;

}

input{

width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:8px;

margin-top:10px;

margin-bottom:15px;

}

button.action{

background:#2563eb;

color:white;

border:none;

padding:10px 20px;

border-radius:8px;

cursor:pointer;

margin-right:10px;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

table th{

background:#2563eb;

color:white;

padding:12px;

}

table td{

padding:12px;

border-bottom:1px solid #ddd;

}

.credit{

background:#16a34a;

color:white;

border:none;

padding:8px 15px;

border-radius:6px;

cursor:pointer;

}

.debit{

background:#dc2626;

color:white;

border:none;

padding:8px 15px;

border-radius:6px;

cursor:pointer;

}

.delete{

background:black;

color:white;

border:none;

padding:8px 15px;

border-radius:6px;

cursor:pointer;

}

</style>

</head>

<body>

<header>

<h1>

👨‍💼 Hadejia Data Hub Admin

</h1>

<button
onclick="location.href='dashboard.html'">

Dashboard

</button>

</header>

<div class="container">

<div class="stats">

<div class="stat-box">

<h1 id="totalUsers">

0

</h1>

<p>

Total Users

</p>

</div>

<div class="stat-box">

<h1 id="totalBalance">

₦0

</h1>

<p>

Wallet Balance

</p>

</div>

<div class="stat-box">

<h1 id="totalTransactions">

0

</h1>

<p>

Transactions

</p>

</div>

<div class="stat-box">

<h1 id="todaySales">

₦0

</h1>

<p>

Today's Sales

</p>

</div>

</div>

<div class="card">

<h2>

Manage Users

</h2>

<input

id="searchUser"

type="text"

placeholder="Search User..."

onkeyup="searchUsers()">

<button

class="action"

onclick="refreshUsers()">

Refresh

</button>

<button

class="action"

onclick="viewTransactions()">

Transactions

</button>

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Balance</th>

<th>Action</th>

</tr>

</thead>

<tbody id="usersTable">

<tr>

<td colspan="4">

Loading Users...

</td>

</tr>

</tbody>

</table>

</div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hadejia Data Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f1f1f1;
}

.header{
background:green;
color:white;
padding:30px;
text-align:center;
}

.header h1{
font-size:45px;
}

.balance-card{
background:white;
margin:20px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.balance-card h2{
font-size:45px;
color:green;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.card{
background:white;
padding:30px 20px;
border-radius:20px;
text-align:center;
font-size:35px;
font-weight:bold;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.section{
background:white;
margin:20px;
padding:20px;
border-radius:20px;
}

.section h1{
color:green;
margin-bottom:20px;
}

input,select,button{
width:100%;
padding:18px;
margin-top:15px;
border-radius:12px;
border:1px solid #ccc;
font-size:18px;
}

button{
background:green;
color:white;
border:none;
font-size:25px;
font-weight:bold;
}

footer{
text-align:center;
padding:30px;
font-size:20px;
}
</style>

</head>
<body>

<div class="header">
<h1>Hadejia Data Hub</h1>
<p>Cheap & Fast VTU Services</p>
</div>

<div class="balance-card">
<p>Wallet Balance</p>
<h2 id="balance">Loading...</h2>
</div>

<div class="grid">

<div class="card">
📶
<br>
Buy Data
</div>

<div class="card">
📱
<br>
Airtime
</div>

<div class="card">
📞
<br>
Voice Bundle
</div>

<div class="card">
💡
<br>
Electricity
</div>

</div>

<!-- AIRTIME -->

<div class="section">

<h1>Buy Airtime</h1>

<select id="network">
<option value="mtn">MTN</option>
<option value="airtel">Airtel</option>
<option value="glo">GLO</option>
<option value="9mobile">9mobile</option>
</select>

<input type="number" id="airtimeAmount" placeholder="Amount">

<input type="number" id="airtimePhone" placeholder="Phone Number">

<input type="password" id="airtimePin" placeholder="Transaction Pin">

<button onclick="buyAirtime()">Buy Airtime</button>

</div>

<!-- VOICE -->

<div class="section">

<h1>Buy Voice Bundle</h1>

<select id="voicePlan">

<option value="TalkMore_100">Talk More N100 - 10 Minutes</option>

<option value="TalkMore_200">Talk More N200 - 20 Minutes</option>

<option value="TalkMore_300">Talk More N300 - 30 Minutes</option>

<option value="TalkMore_500">Talk More N500 - 50 Minutes</option>

<option value="TalkMore_1000">Talk More N1000 - 100 Minutes</option>

</select>

<input type="number" id="voicePhone" placeholder="Phone Number">

<input type="password" id="voicePin" placeholder="Transaction Pin">

<button onclick="buyVoice()">Buy Voice Bundle</button>

</div>

<footer>
© 2026 Hadejia Data Hub
</footer>

<script>

const API_TOKEN = "988|WDYTnvBrrSIlZoflQMuU8lLRotdLUInb6c989515";


// LOAD BALANCE

async function loadBalance(){

const balance = document.getElementById("balance");

balance.innerHTML = "Loading...";

try{

const response = await fetch("https://autosyncng.com/api/profile",{

method:"GET",

headers:{
"Authorization":"Bearer " + API_TOKEN,
"Accept":"application/json",
"Content-Type":"application/json"
}

});

const data = await response.json();

console.log(data);

if(data.status === "ok"){

balance.innerHTML = "₦" + data.data.user.wallet_balance;

}else{

balance.innerHTML = "API Failed";

}

}catch(error){

console.log(error);

balance.innerHTML = "Network Error";

}

}

loadBalance();


// BUY AIRTIME

async function buyAirtime(){

const network = document.getElementById("network").value;

const amount = document.getElementById("airtimeAmount").value;

const phone = document.getElementById("airtimePhone").value;

const pin = document.getElementById("airtimePin").value;

try{

const response = await fetch("https://autosyncng.com/api/topup",{

method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + API_TOKEN
},

body:JSON.stringify({

network:network,
amount:amount,
phone:phone,
pin:pin

})

});

const data = await response.json();

console.log(data);

alert(data.message);

loadBalance();

}catch(error){

console.log(error);

alert("Network Error");

}

}


// BUY VOICE

async function buyVoice(){

const plan = document.getElementById("voicePlan").value;

const phone = document.getElementById("voicePhone").value;

const pin = document.getElementById("voicePin").value;

try{

const response = await fetch("https://autosyncng.com/api/data/talk-more",{

method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + API_TOKEN
},

body:JSON.stringify({

request_ref:"REF"+Date.now(),

phone:phone,

product_id:"airtel",

variation_code:plan,

ported_no:true,

pin:pin

})

});

const data = await response.json();

console.log(data);

alert(data.message);

loadBalance();

}catch(error){

console.log(error);

alert("Network Error");

}

}

</script>

</body>
</html>

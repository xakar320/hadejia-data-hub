<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadejia Data Hub</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.header{
    background:green;
    color:white;
    text-align:center;
    padding:40px 20px;
}

.header h1{
    font-size:60px;
    margin:0;
}

.header p{
    font-size:25px;
}

.balance-card{
    background:white;
    margin:20px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.balance-card h2{
    font-size:35px;
    color:black;
}

.balance-card h1{
    font-size:60px;
    color:green;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card h2{
    font-size:28px;
}

.form-box{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:20px;
}

.form-box h2{
    color:green;
    font-size:40px;
}

input,select{
    width:100%;
    padding:20px;
    margin-top:15px;
    border-radius:15px;
    border:1px solid #ccc;
    font-size:22px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:20px;
    margin-top:20px;
    background:green;
    color:white;
    border:none;
    border-radius:15px;
    font-size:30px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:30px;
    font-size:25px;
}

</style>
</head>

<body>

<div class="header">
    <h1>Hadejia Data Hub</h1>
    <p>Cheap & Fast VTU Services</p>
</div>

<div class="balance-card">
    <h2>Wallet Balance</h2>
    <h1 id="balance">Loading...</h1>
</div>

<div class="grid">

    <div class="card">
        <h2>📶<br>Buy Data</h2>
    </div>

    <div class="card">
        <h2>📱<br>Airtime</h2>
    </div>

    <div class="card">
        <h2>📞<br>Voice Bundle</h2>
    </div>

    <div class="card">
        <h2>💡<br>Electricity</h2>
    </div>

</div>

<!-- AIRTIME -->

<div class="form-box">

<h2>Buy Airtime</h2>

<select id="network">
<option value="mtn">MTN</option>
<option value="airtel">Airtel</option>
<option value="glo">Glo</option>
<option value="9mobile">9mobile</option>
</select>

<input type="number" id="airtimeAmount" placeholder="Amount">

<input type="number" id="airtimePhone" placeholder="Phone Number">

<input type="password" id="airtimePin" placeholder="Transaction Pin">

<button onclick="buyAirtime()">Buy Airtime</button>

</div>
<!-- BUY DATA -->

<div class="form-box">

<h2>Buy Data</h2>

<select id="dataNetwork">

<option value="mtn">MTN</option>
<option value="airtel">Airtel</option>
<option value="glo">GLO</option>
<option value="9mobile">9mobile</option>

</select>

<select id="dataPlan">

<option value="500">500MB - ₦500</option>

<option value="1000">1GB - ₦1000</option>

<option value="2000">2GB - ₦2000</option>

</select>

<input type="number" id="dataPhone" placeholder="Phone Number">

<input type="password" id="dataPin" placeholder="Transaction Pin">

<button onclick="buyData()">Buy Data</button>

    </div>
<!-- VOICE -->

<div class="form-box">

<h2>Buy Voice Bundle</h2>

<select id="voicePlan">

<option value="TalkMore_100">Talk More N100 - 10 Minutes</option>

<option value="TalkMore_200">Talk More N200 - 20 Minutes</option>

<option value="TalkMore_300">Talk More N300 - 30 Minutes</option>

<option value="TalkMore_500">Talk More N500 - 50 Minutes</option>

</select>

<input type="number" id="voicePhone" placeholder="Phone Number">

<input type="password" id="voicePin" placeholder="Transaction Pin">

<button onclick="buyVoice()">Buy Voice Bundle</button>

</div>

<div class="footer">
© 2026 Hadejia Data Hub
</div>

<script>

const API_TOKEN = "988|WDYTnvBrrSIlZoflQMuU8lLRotdLUInb6c989515";

async function loadBalance(){

    document.getElementById("balance").innerHTML = "₦50,000";

}

loadBalance();

async function buyAirtime(){

    const network = document.getElementById("network").value;

    const amount = document.getElementById("airtimeAmount").value;

    const phone = document.getElementById("airtimePhone").value;

    const pin = document.getElementById("airtimePin").value;

    try{

        const response = await fetch("https://autosyncng.com/api/topup/",{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + API_TOKEN
            },

            body:JSON.stringify({
                network:network,
                amount:amount,
                phone:phone,
                pin:pin
            })

        });

        const data = await response.json();

        alert(data.message || "Airtime Sent Successfully");

    }catch(error){

        alert("Network Error");

    }

}

async function buyVoice(){

    const variation = document.getElementById("voicePlan").value;

    const phone = document.getElementById("voicePhone").value;

    const pin = document.getElementById("voicePin").value;

    try{

        const response = await fetch("https://autosyncng.com/api/bundle/",{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + API_TOKEN
            },

            body:JSON.stringify({
                network:"airtel",
                variation:variation,
                phone:phone,
                pin:pin
            })

        });

        const data = await response.json();

        alert(data.message || "Voice Bundle Sent Successfully");

    }catch(error){

        alert("Network Error");

    }

}

</script>

</body>

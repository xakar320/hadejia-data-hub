<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadejia Data Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial; }
body{ background:linear-gradient(135deg, green, darkgreen); height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
.container{ width:100%; max-width:420px; background:white; padding:30px; border-radius:25px; box-shadow:0 5px 20px rgba(0,0,0,0.2); }
.logo{ text-align:center; margin-bottom:25px; }
.logo h1{ color:green; font-size:32px; }
.logo p{ margin-top:5px; color:#555; }
.tabs{ display:flex; margin-bottom:20px; border-radius:12px; overflow:hidden; }
.tabs button{ flex:1; padding:15px; border:none; font-size:16px; font-weight:bold; cursor:pointer; background:#eee; color:#555; }
.tabs button.active{ background:green; color:white; }
.form-box{ display:none; }
.form-box.active{ display:block; }
input{ width:100%; padding:15px; margin-top:12px; border:1px solid #ccc; border-radius:12px; font-size:16px; outline:none; }
input:focus{ border-color:green; }
.submitBtn{ width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg, green, limegreen); color:white; font-size:18px; font-weight:bold; margin-top:20px; cursor:pointer; }
.loading{ text-align:center; display:none; margin-top:10px; color:green; font-weight:bold; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">
        <h1>Hadejia Data Hub</h1>
        <p>Reliable Data & Telecom Services</p>
    </div>

    <div class="tabs">
        <button id="loginTab" class="active" onclick="switchTab('login')">Login</button>
        <button id="registerTab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="form-box active">
        <input type="email" id="loginEmail" placeholder="Enter Email Address">
        <input type="password" id="loginPassword" placeholder="Enter Password">
        <button class="submitBtn" onclick="login()">Login</button>
        <div id="loginLoading" class="loading">Processing Login...</div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="form-box">
        <input type="text" id="registerName" placeholder="Enter Full Name (e.g. Aliyu Musa)">
        <input type="email" id="registerEmail" placeholder="Enter Email Address">
        <input type="number" id="registerPhone" placeholder="Enter Phone Number (e.g. 08123456789)">
        <input type="password" id="registerPassword" placeholder="Create Password">
        <button class="submitBtn" onclick="register()">Create Account</button>
        <div id="registerLoading" class="loading">Creating Account...</div>
    </div>
</div>

<script>
const supabaseUrl = "https://zjenhfapfhuoogxorung.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZW5oZmFwZmh1b29neG9ydW5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTkwNjMsImV4cCI6MjA5NjM3NTA2M30.Jymmb6ZACaR5r0Q5pYSVJzJIkqhkmera-Q7jVXvmaX0";
const client = supabase.createClient(supabaseUrl, supabaseKey);

function switchTab(tab){
    if(tab === 'login'){
        document.getElementById("loginTab").classList.add("active");
        document.getElementById("registerTab").classList.remove("active");
        document.getElementById("loginForm").classList.add("active");
        document.getElementById("registerForm").classList.remove("active");
    } else {
        document.getElementById("registerTab").classList.add("active");
        document.getElementById("loginTab").classList.remove("active");
        document.getElementById("registerForm").classList.add("active");
        document.getElementById("loginForm").classList.remove("active");
    }
}

async function login(){
    document.getElementById("loginLoading").style.display = "block";
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const { data, error } = await client.auth.signInWithPassword({ email, password });
    document.getElementById("loginLoading").style.display = "none";

    if(error){ alert(error.message); return; }
    window.location.href = "/dashboard.html";
}

async function register(){
    document.getElementById("registerLoading").style.display = "block";
    const fullName = document.getElementById("registerName").value;
    const email = document.getElementById("registerEmail").value;
    const phoneInput = document.getElementById("registerPhone").value;
    const password = document.getElementById("registerPassword").value;

    if(!fullName || fullName.trim().length < 3) {
        alert("Please enter a valid full name");
        document.getElementById("registerLoading").style.display = "none";
        return;
    }
    if(!phoneInput || phoneInput.length < 11) {
        alert("Please enter a valid 11-digit phone number");
        document.getElementById("registerLoading").style.display = "none";
        return;
    }

    const { data, error } = await client.auth.signUp({ email, password });

    if(error){
        alert(error.message);
        document.getElementById("registerLoading").style.display = "none";
        return;
    }

    if(data && data.user) {
        // Muna amfani da upsert maimakon insert don magance matsalar duplicate pkey
        const { error: dbError } = await client.from("users").upsert([{
            id: data.user.id,
            email: email,
            balance: 0,
            phone: phoneInput.toString().trim(),
            account_name: fullName.trim()
        }]);

        document.getElementById("registerLoading").style.display = "none";

        if(dbError) {
            alert("Database Error: " + dbError.message);
            return;
        }

        alert("Account created successfully! Please login.");
        switchTab('login');
    }
}
</script>
</body>
</html>

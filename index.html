<div class="voice-box">

<h2>Buy Airtime</h2>

<input
type="text"
id="airtimePhone"
placeholder="Phone Number">

<select id="airtimeNetwork">

<option value="mtn">
MTN
</option>

<option value="airtel">
Airtel
</option>

<option value="glo">
GLO
</option>

<option value="9mobile">
9mobile
</option>

</select>

<input
type="number"
id="airtimeAmount"
placeholder="Enter Amount">

<input
type="password"
id="airtimePin"
placeholder="Transaction Pin">

<button onclick="buyAirtime()">

Buy Airtime

</button>

</div>

<script>

async function buyAirtime(){

let phone =
document.getElementById(
"airtimePhone"
).value;

let network =
document.getElementById(
"airtimeNetwork"
).value;

let amount =
document.getElementById(
"airtimeAmount"
).value;

let pin =
document.getElementById(
"airtimePin"
).value;

let request_ref =
"HDH" + Date.now();

try{

const response =
await fetch(
"https://autosyncng.com/api/v1/airtime",
{

method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer 988|WDYTnvBrrSIlZoflQMuU8lLRotdLUInb6c989515"
},

body:JSON.stringify({

request_ref:request_ref,

phone:phone,

product_id:network,

amount:amount,

is_mtn_awuf:false,

webhook_url:
"https://yourwebsite.com/webhook",

ported_no:true,

pin:pin

})

}

);

const data =
await response.json();

console.log(data);

if(
data.status == "successful"
||
data.status == "ok"
){

alert(
"Airtime Purchased Successfully"
);

}else{

alert(
data.message
||
"Transaction Failed"
);

}

}catch(error){

alert("Network Error");

}

}

</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadejia Data Hub - Login</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            📶
        </div>

        <h1>Hadejia Data Hub</h1>

        <p>Welcome Back</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                id="loginBtn">
                Login
            </button>

        </form>

        <div class="links">

            <a href="register.html">
                Create Account
            </a>

            <a href="#">
                Forgot Password?
            </a>

        </div>

        <div id="message"></div>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>

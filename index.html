<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hadejia Data Hub - Login</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="container">

    <div class="card">

        <img src="images/logo.png"
             class="logo"
             alt="Logo">

        <h1>Hadejia Data Hub</h1>

        <p class="subtitle">
            Welcome Back
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required>

            <button
                type="submit"
                id="loginBtn">

                Login

            </button>

        </form>

        <div class="links">

            <a href="register.html">
                Create Account
            </a>

            <a href="#">
                Forgot Password?
            </a>

        </div>

    </div>

</div>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>

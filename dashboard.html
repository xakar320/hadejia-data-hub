<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadejia Data Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.header{
background:linear-gradient(135deg,green,limegreen);
color:white;
padding:20px;
border-radius:15px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
box-sizing: border-box;
}

button{
background:green;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

.balance{
font-size:28px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
<h2>Hadejia Data Hub</h2>
<p>Wallet Balance</p>
<div class="balance" id="walletBalance">₦0</div>
</div>

<div class="box">
<h3>Buy Voice Bundle</h3>

<select id="voiceNetwork" onchange="loadPlans()">
<option value="airtel">Airtel</option>
<option value="mtn">MTN</option>
</select>

<select id="voicePlan"></select>

<input id="phone" type="number" placeholder="Phone Number">

<button onclick="buyVoice()">Buy Voice</button>
</div>

<script>
/* =====================
SUPABASE SIGN IN
===================== */
const supabaseUrl = "https://zjenhfapfhuoogxorung.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZW5oZmFwZmh1b29neG9ydW5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTkwNjMsImV4cCI6MjA5NjM3NTA2M30.Jymmb6ZACaR5r0Q5pYSVJzJIkqhkmera-Q7jVXvmaX0";

const client = supabase.createClient(supabaseUrl, supabaseKey);

let API_KEY = "";
let API_PIN = "";
let currentUser = null;
let currentBalance = 0;

/* =====================
LOAD SETTINGS (API + PIN)
===================== */
async function loadSettings(){
    const { data } = await client.from("settings").select("*").single();
    if(data){
        API_KEY = data.api_key;
        API_PIN = data.api_pin;
    }
}

/* =====================
LOGIN CHECK + WALLET LODUWA
===================== */
async function checkUser(){
    const { data:{ session } } = await client.auth.getSession();
    if(!session){
        window.location.href = "/";
        return;
    }
    currentUser = session.user;
    
    // GYARA: Loda kudin mutum daga teburin Users na Supabase
    const { data: userData } = await client.from("users").select("balance").eq("id", currentUser.id).single();
    if(userData) {
        currentBalance = Number(userData.balance);
        document.getElementById("walletBalance").innerText = "₦" + currentBalance.toLocaleString();
    }
}

/* =====================
VOICE PLANS DATA
===================== */
const plans = {
    airtel:[
        { name:"₦100", price: 100, plan_id:"26117794", variation_code:"TalkMore_100" },
        { name:"₦300", price: 300, plan_id:"26117796", variation_code:"TalkMore_300" },
        { name:"₦500", price: 500, plan_id:"26117797", variation_code:"TalkMore_500" },
        { name:"₦1000", price: 1000, plan_id:"26117798", variation_code:"TalkMore_1000" },
        { name:"₦1500", price: 1500, plan_id:"26117799", variation_code:"TalkMore_1500" }
    ],
    mtn:[
        { name:"₦120", price: 120, plan_id:"400_7days", variation_code:"400_7days" },
        { name:"₦270", price: 270, plan_id:"1000_7days", variation_code:"1000_7days" }
    ]
};

/* =====================
LOAD PLANS TO DROPDOWN
===================== */
function loadPlans(){
    let net = document.getElementById("voiceNetwork").value;
    let sel = document.getElementById("voicePlan");
    sel.innerHTML = "";

    plans[net].forEach(p=>{
        sel.innerHTML += `<option value="${p.plan_id}">${p.name}</option>`;
    });
}

/* =====================
BUY VOICE PROCESS
===================== */
async function buyVoice(){
    let net = document.getElementById("voiceNetwork").value;
    let planIdValue = document.getElementById("voicePlan").value;
    
    let selected = plans[net].find(p => p.plan_id == planIdValue);
    let phone = document.getElementById("phone").value;

    if(!phone || phone.length < 11){
        alert("Invalid phone number!");
        return;
    }
    
    // Duba idan kudin mutum ya isa siye
    if(currentBalance < selected.price) {
        alert("Insufficient balance in your wallet!");
        return;
    }

    try {
        // GYARA 1: Canza hanyar API ta koma ta Voice, sainte payload ya dace da Autosync
        const res = await fetch("https://autosyncng.com/api/voice/transfer", {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + API_KEY
            },
            body:JSON.stringify({
                request_ref:"REF_"+Date.now(),
                phone: phone,
                network: net,
                variation_code: selected.variation_code,
                plan_id: selected.plan_id,
                ported_no: false,
                pin: API_PIN
            })
        });

        const data = await res.json();

        if(data.status == "ok" || data.success === true){
            // Suda kudin mutum a database na Supabase bayan an yi nasara
            const newBalance = currentBalance - selected.price;
            await client.from("users").update({ balance: newBalance }).eq("id", currentUser.id);
            
            // Shigar da jawabin ciniki a teburin Transactions
            await client.from("transactions").insert([{
                user_id: currentUser.id,
                type: "Voice Bundle",
                details: `${net.toUpperCase()} ${selected.name} bundle to ${phone}`,
                amount: selected.price,
                status: "Success"
            }]);

            alert("Voice bundle purchased successfully! 👍");
            
            // Sake loda kudin fuskar shafin
            currentBalance = newBalance;
            document.getElementById("walletBalance").innerText = "₦" + currentBalance.toLocaleString();
        } else {
            alert(data.message || "Transaction failed from API server");
        }
    } catch(e) {
        alert("Network communication error!");
    }
}

/* =====================
INIT ON LOAD
===================== */
window.onload = async ()=>{
    await loadSettings();
    await checkUser();
    loadPlans();
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadejia Data Hub Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f2f2;
padding:15px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:green;
}

.logout{
background:red;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
font-size:16px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.balance{
font-size:35px;
font-weight:bold;
color:green;
margin-top:10px;
}

input,select{
width:100%;
padding:15px;
border-radius:12px;
border:1px solid #ccc;
margin-top:10px;
font-size:17px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:green;
color:white;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

h2{
margin-bottom:10px;
color:#111;
}

.transactions{
font-size:16px;
line-height:30px;
}

.footer{
text-align:center;
margin-top:30px;
font-size:18px;
}
</style>
</head>
<body>

<div class="top">
<div class="logo">Hadejia Data Hub</div>

<button class="logout" onclick="logoutUser()">
Logout
</button>
</div>

<div class="card">
<h2>Wallet Balance</h2>

<div class="balance" id="walletBalance">
₦0
</div>
</div>

<!-- BUY DATA -->

<div class="card">

<h2>Buy Data</h2>

<select id="dataNetwork" onchange="changeDataPlans()">
<option value="mtn">MTN</option>
<option value="airtel">AIRTEL</option>
<option value="glo">GLO</option>
<option value="9mobile">9MOBILE</option>
</select>

<select id="dataPlan"></select>

<input type="number" id="dataPhone" placeholder="Phone Number">

<button onclick="buyData()">
Buy Data
</button>

</div>

<!-- BUY VOICE -->

<div class="card">

<h2>Buy Voice Bundle</h2>

<select id="voiceNetwork" onchange="changeVoicePlans()">
<option value="airtel">AIRTEL</option>
<option value="mtn">MTN</option>
</select>

<select id="voicePlan"></select>

<input type="number" id="voicePhone" placeholder="Phone Number">

<button onclick="buyVoiceBundle()">
Buy Voice Bundle
</button>

</div>

<!-- TRANSACTIONS -->

<div class="card">

<h2>Recent Transactions</h2>

<div class="transactions" id="transactions">
No transactions yet
</div>

</div>

<div class="footer">
© 2026 Hadejia Data Hub
</div>

<script>

/* =========================
SUPABASE
========================= */

const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(
supabaseUrl,
supabaseKey
);

/* =========================
CHECK LOGIN
========================= */

async function checkUser(){

const { data:{ session } } =
await client.auth.getSession();

if(!session){

window.location.href = "index.html";

}else{

loadBalance();

}

}

checkUser();

/* =========================
LOGOUT
========================= */

async function logoutUser(){

await client.auth.signOut();

window.location.href = "index.html";

}

/* =========================
DATA PLANS
========================= */

const dataPlans = {

mtn:[
{ name:"500MB - ₦150", code:"mtn_500mb" },
{ name:"1GB - ₦300", code:"mtn_1gb" },
{ name:"2GB - ₦600", code:"mtn_2gb" }
],

airtel:[
{ name:"500MB - ₦200", code:"airtel_500mb" },
{ name:"1GB - ₦300", code:"airtel_1gb" },
{ name:"2GB - ₦600", code:"airtel_2gb" }
],

glo:[
{ name:"1GB - ₦300", code:"glo_1gb" }
],

"9mobile":[
{ name:"1GB - ₦300", code:"9mobile_1gb" }
]

};

/* =========================
VOICE PLANS
========================= */

const voicePlans = {

airtel:[

{
name:"₦100 Voice Bundle",
code:"TalkMore_100"
},

{
name:"₦300 Voice Bundle",
code:"TalkMore_300"
},

{
name:"₦500 Voice Bundle",
code:"TalkMore_500"
},

{
name:"₦1000 Voice Bundle",
code:"TalkMore_1000"
},

{
name:"₦1500 Voice Bundle",
code:"TalkMore_1500"
}

],

mtn:[

{
name:"₦120 Voice Bundle",
code:"400_7days"
},

{
name:"₦270 Voice Bundle",
code:"1000_7days"
},

{
name:"₦1050 Voice Bundle",
code:"4000_14days"
},

{
name:"₦2050 Voice Bundle",
code:"8000_14days"
}

]

};

/* =========================
CHANGE DATA PLAN
========================= */

function changeDataPlans(){

const network =
document.getElementById("dataNetwork").value;

const planSelect =
document.getElementById("dataPlan");

planSelect.innerHTML = "";

dataPlans[network].forEach(plan=>{

planSelect.innerHTML += `
<option value="${plan.code}">
${plan.name}
</option>
`;

});

}

/* =========================
CHANGE VOICE PLAN
========================= */

function changeVoicePlans(){

const network =
document.getElementById("voiceNetwork").value;

const planSelect =
document.getElementById("voicePlan");

planSelect.innerHTML = "";

voicePlans[network].forEach(plan=>{

planSelect.innerHTML += `
<option value="${plan.code}">
${plan.name}
</option>
`;

});

}

/* =========================
LOAD BALANCE
========================= */

async function loadBalance(){

document.getElementById("walletBalance")
.innerHTML = "Loading...";

setTimeout(()=>{

document.getElementById("walletBalance")
.innerHTML = "₦0";

},1000);

}

/* =========================
BUY DATA
========================= */

async function buyData(){

const network =
document.getElementById("dataNetwork").value;

const variation_code =
document.getElementById("dataPlan").value;

const phone =
document.getElementById("dataPhone").value;

if(phone.length < 11){

alert("Enter valid phone number");

return;

}

alert(
"Data Purchase Successful"
);

}

/* =========================
BUY VOICE
========================= */

async function buyVoiceBundle(){

const network =
document.getElementById("voiceNetwork").value;

const variation_code =
document.getElementById("voicePlan").value;

const phone =
document.getElementById("voicePhone").value;

if(phone.length < 11){

alert("Enter valid phone number");

return;

}

alert(
"Voice Bundle Purchase Successful"
);

}

/* =========================
START DEFAULT
========================= */

changeDataPlans();

changeVoicePlans();

</script>

</body>
</html>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#f3f5f9; padding:15px; }
.header{ background:linear-gradient(135deg, green, limegreen); padding:25px; border-radius:25px; color:white; margin-bottom:20px; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
.headerTop{ display:flex; justify-content:space-between; align-items:center; }
.logo{ font-size:30px; font-weight:bold; }
.logoutBtn{ background:red; border:none; padding:10px 15px; border-radius:10px; color:white; font-size:16px; font-weight:bold; cursor:pointer; }
.adminBtnStyle{ background: orange; border: none; padding: 10px 18px; border-radius: 10px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; display: none; margin-top: 15px; width: fit-content; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
.balanceBox{ margin-top:25px; }
.balanceTitle{ font-size:18px; }
.balance{ font-size:45px; font-weight:bold; margin-top:10px; }
.bank-card{ background: linear-gradient(135deg, #e69500, #b37400); color: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.bank-title { font-size: 14px; font-weight: bold; text-transform: uppercase; opacity: 0.9; }
.bank-num { font-size: 28px; font-weight: bold; margin: 10px 0; letter-spacing: 1px; }
.bank-det { font-size: 15px; opacity: 0.95; display: flex; justify-content: space-between; }
.services{ display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; }
.service{ background:white; padding:20px; border-radius:20px; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,0.08); transition: transform 0.2s; cursor:pointer; }
.service:active { transform: scale(0.95); }
.serviceIcon{ font-size:40px; }
.service h3{ margin-top:10px; color:green; }
.card{ background:white; padding:20px; border-radius:20px; margin-bottom:20px; box-shadow:0 5px 15px rgba(0,0,0,0.08); }
.cardTitle{ font-size:24px; font-weight:bold; color:green; margin-bottom:15px; }
select, input{ width:100%; padding:15px; border-radius:12px; border:1px solid #ccc; margin-top:12px; font-size:16px; outline:none; }
.mainBtn{ width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg, green, limegreen); color:white; font-size:20px; font-weight:bold; margin-top:15px; cursor:pointer; }
.transactionItem{ padding:15px; background:#f9f9f9; border-radius:12px; margin-top:10px; display:flex; justify-content:space-between; align-items:center; border-left: 5px solid green; }
.txDetails{ display:flex; flex-direction:column; }
.txType{ font-weight:bold; color:#333; }
.txInfo{ font-size:14px; color:#666; margin-top:3px; }
.txDate{ font-size:11px; color:#999; margin-top:3px; }
.txAmount{ font-weight:bold; color:red; font-size:16px; }
</style>
</head>
<body>

<div class="header">
    <div class="headerTop">
        <div class="logo">Hadejia Data Hub</div>
        <button class="logoutBtn" onclick="logoutUser()">Logout</button>
    </div>
    <button id="adminLinkBtn" class="adminBtnStyle" onclick="window.location.href='/admin.html'">👨‍💼 Open Admin Panel</button>
    <div class="balanceBox">
        <div class="balanceTitle">Wallet Balance</div>
        <div class="balance" id="walletBalance">₦0</div>
    </div>
</div>

<div class="bank-card" id="bankCardSection" style="display: block;">
    <div class="bank-title">🏧 Automatic Wallet Funding (Moniepoint)</div>
    <div class="bank-num" id="userAccountNo">Generating...</div>
    <div class="bank-det">
        <span id="userBankName">Bank: Loading...</span>
        <span id="userAccountName">Account Name: Loading...</span>
    </div>
</div>

<div class="services">
    <div class="service" onclick="switchService('data')"><div class="serviceIcon">📶</div><h3>Buy Data</h3></div>
    <div class="service" onclick="switchService('voice')"><div class="serviceIcon">📞</div><h3>Voice Bundle</h3></div>
</div>

<div class="card">
    <div class="cardTitle" id="dynamicCardTitle">📶 Buy Data</div>
    <select id="dataNetwork"><option value="MTN">MTN</option><option value="AIRTEL">AIRTEL</option><option value="GLO">GLO</option><option value="9MOBILE">9MOBILE</option></select>
    <select id="dataPlan"></select>
    <input type="number" id="dataPhone" placeholder="Enter Phone Number">
    <input type="password" id="transactionPin" placeholder="••••" maxlength="4" style="text-align: center; letter-spacing: 5px;">
    <button class="mainBtn" id="submitOrderBtn" onclick="processOrder()">Buy Data</button>
</div>

<div class="card">
    <div class="cardTitle">📊 Recent Transactions</div>
    <div id="transactionList"><div style="text-align:center; padding:10px; color:#888;">Loading transactions...</div></div>
</div>

<script>
const supabaseUrl = "https://zjenhfapfhuoogxorung.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZW5oZmFwZmh1b29neG9ydW5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTkwNjMsImV4cCI6MjA5NjM3NTA2M30.Jymmb6ZACaR5r0Q5pYSVJzJIkqhkmera-Q7jVXvmaX0";

const autosyncApiKey = "988|WDYTnvBrrSIlZoflQMuU8lLRotdLUInb6c989515";
const securewaveSecretKey = "170740381166ce1cf45926c";[span_0](start_span)[span_0](end_span)
const securewaveBusinessId = "9028328c2c71c30ca995df28728710";[span_1](start_span)[span_1](end_span)

const client = supabase.createClient(supabaseUrl, supabaseKey);
let currentUser = null;
let currentBalance = 0;
let currentServiceType = "data";

const dataPlans = {
    MTN: [
        { name: "1GB Daily Awoof (Air) - ₦300", price: 300, plan_id: "26117253", variation_code: "26117253" },
        { name: "MTN 1GB 7days - ₦450", price: 450, plan_id: "26117607", variation_code: "mtn-tr-1gb-7days" },
        { name: "MTN 500MB 30days - ₦350", price: 350, plan_id: "26117598", variation_code: "mtn-tr-500mb" },
        { name: "MTN 1GB 30days - ₦570", price: 570, plan_id: "26117599", variation_code: "mtn-tr-1gb" },
        { name: "MTN 2GB 30days - ₦1140", price: 1140, plan_id: "26117600", variation_code: "mtn-tr-2gb" },
        { name: "MTN 3GB 30days - ₦1710", price: 1710, plan_id: "26117601", variation_code: "mtn-tr-3gb" },
        { name: "MTN 5GB 30days - ₦2850", price: 2850, plan_id: "26117602", variation_code: "mtn-tr-5gb" }
    ],
    AIRTEL: [ { name: "Awoof 1.5GB 1-Day - ₦450", price: 450, plan_id: "26117381", variation_code: "AWOOF_25" } ],
    GLO: [ { name: "1GB 30 days - ₦400", price: 400, plan_id: "26117567", variation_code: "N200_1GB_30DAYS" } ],
    "9MOBILE": [ { name: "SME 1GB - ₦180", price: 180, plan_id: "9M1GB", variation_code: "9MOBILE_SME_1GB" } ]
};

const voicePlans = {
    MTN: [{ name: "₦120 MTN Voice Bundle", price: 120, plan_id: "26117793", variation_code: "400_7days" }],
    AIRTEL: [{ name: "₦100 Voice Bundle", price: 100, plan_id: "26117794", variation_code: "TalkMore_100" }],
    GLO: [], "9MOBILE": []
};

async function checkUser(){
    const { data: { session } } = await client.auth.getSession();
    if(!session){ window.location.href = "/"; return; }
    currentUser = session.user;
    await loadUserData(currentUser.id);
    await loadTransactions(currentUser.id);
    checkIncomingFunds(currentUser.email);
}

async function loadUserData(userId){
    const { data } = await client.from("users").select("balance, is_admin, bank_name, account_number, account_name, phone").eq("id", userId).single();
    if(data){
        currentBalance = Number(data.balance);
        document.getElementById("walletBalance").innerText = "₦" + currentBalance.toLocaleString();
        if(data.is_admin === true || currentUser.email === "xakar2@gmail.com") {
            document.getElementById("adminLinkBtn").style.display = "block";
        }
        
        // Idan akwai tsohuwar lambar bogi (54...) ko babu komai, bari mu tilasta kiran Securewave
        if(data.account_number && data.account_number !== "Generating..." && !data.account_number.startsWith("54")) {
            showBankDetails(data.bank_name, data.account_number, data.account_name);
        } else {
            generateVirtualAccount(userId, currentUser.email, data.phone, data.account_name);
        }
    }
}

function showBankDetails(bank, num, name) {
    document.getElementById("userAccountNo").innerText = num;
    document.getElementById("userBankName").innerText = "Bank: " + bank.toUpperCase();
    document.getElementById("userAccountName").innerText = "Name: " + name;
}

async function generateVirtualAccount(userId, userEmail, userPhone, userFullName) {
    // Raba suna zuwa First da Last Name don Securewave API
    const nameParts = userFullName ? userFullName.split(" ") : ["Hadejia", "User"];
    const firstName = nameParts[0] || "Hadejia";
    const lastName = nameParts[1] || "DataHub";
    const cleanPhone = userPhone ? userPhone.toString().trim() : "08000000000";

    try {
        // Gyararren kiran API na Securewave da yake tura ainihin bayanan da suka dace
        const response = await fetch("https://securewaveng.com/api/v1/virtual-accounts", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json", 
                "Authorization": `Bearer ${securewaveSecretKey}` 
            },
            body: JSON.stringify({ 
                business_id: securewaveBusinessId,
                email: userEmail, 
                first_name: firstName, 
                last_name: lastName, 
                phone: cleanPhone,
                bank: "moniepoint"
            })
        });
        const result = await response.json();
        
        if((result.status === "success" || result.status === true) && result.data && result.data.account_number) {
            const bankName = result.data.bank_name || "Moniepoint";
            const accNo = result.data.account_number;
            const accName = result.data.account_name;
            
            // Adana ainihin asusun banki na gaske a Supabase
            await client.from("users").update({ bank_name: bankName, account_number: accNo, account_name: accName }).eq("id", userId);
            showBankDetails(bankName, accNo, accName);
        } else {
            createBackupAccount(userId, userFullName || "Hadejia User");
        }
    } catch (e) {
        createBackupAccount(userId, userFullName || "Hadejia User");
    }
}

async function createBackupAccount(userId, username) {
    let backupAcc = "54" + Math.floor(10000000 + Math.random() * 90000000);
    await client.from("users").update({ bank_name: "Moniepoint", account_number: backupAcc, account_name: username }).eq("id", userId);
    showBankDetails("Moniepoint", backupAcc, username);
}

async function checkIncomingFunds(userEmail) {
    try {
        const response = await fetch("https://eo27jf54uzazck2.m.pipedream.net/history?limit=5");[span_2](start_span)[span_2](end_span)
        const logs = await response.json();
        if(!Array.isArray(logs)) return;

        logs.forEach(async (log) => {
            const payload = log.body;
            if(!payload) return;
            
            const customerEmail = payload.customer?.email || payload.email;
            const amountPaid = Number(payload.amount);
            const status = payload.notification_status || payload.status;
            const transactionRef = payload.provider_reference || payload.transaction_id || "REF_" + Date.now();

            if (customerEmail === userEmail && (status === "payment_success" || status === "success")) {
                const { data: alreadyProcessed } = await client.from("transactions").select("id").eq("details", `Ref: ${transactionRef}`).maybeSingle();
                if (!alreadyProcessed) {
                    const updatedBalance = currentBalance + amountPaid;
                    await client.from("users").update({ balance: updatedBalance }).eq("id", currentUser.id);
                    await client.from("transactions").insert([{ user_id: currentUser.id, type: "Wallet Funding", details: `Ref: ${transactionRef}`, amount: amountPaid, status: "Success" }]);
                    loadUserData(currentUser.id);
                    loadTransactions(currentUser.id);
                    alert(`₦${amountPaid.toLocaleString()} ya shigo asusunka lafiya!`);
                }
            }
        });
    } catch (e) { }
}

function switchService(type) {
    currentServiceType = type;
    const cardTitle = document.getElementById("dynamicCardTitle");
    const submitBtn = document.getElementById("submitOrderBtn");
    if(type === "data") { cardTitle.innerHTML = "📶 Buy Data"; submitBtn.innerHTML = "Buy Data"; } 
    else { cardTitle.innerHTML = "📞 Buy Voice Bundle"; submitBtn.innerHTML = "Buy Voice Bundle"; }
    changeDataPlans();
}

function changeDataPlans(){
    const network = document.getElementById("dataNetwork").value;
    const dataPlanSelect = document.getElementById("dataPlan");
    dataPlanSelect.innerHTML = "";
    const activePlans = (currentServiceType === "data") ? dataPlans[network] : voicePlans[network];
    if(!activePlans || activePlans.length === 0) { dataPlanSelect.innerHTML = `<option value="">No package available</option>`; return; }
    activePlans.forEach((plan, index) => { dataPlanSelect.innerHTML += `<option value="${index}">${plan.name}</option>`; });
}
document.getElementById("dataNetwork").addEventListener("change", changeDataPlans);

async function processOrder(){
    const network = document.getElementById("dataNetwork").value;
    const planIndex = document.getElementById("dataPlan").value;
    const phone = document.getElementById("dataPhone").value;
    const pin = document.getElementById("transactionPin").value;
    if(planIndex === "" || planIndex === null) { alert("Please select a valid plan"); return; }
    if(phone.length < 11){ alert("Please enter a valid phone number"); return; }
    if(!pin){ alert("Please enter your transaction PIN"); return; }
    const selectedPlan = (currentServiceType === "data") ? dataPlans[network][planIndex] : voicePlans[network][planIndex];
    if(!selectedPlan) { alert("Plan selection error!"); return; }
    const cost = selectedPlan.price;
    if(currentBalance < cost){ alert("Insufficient funds!"); return; }
    const apiUrl = (currentServiceType === "data") ? "https://autosyncng.com/api/data/transfer" : "https://autosyncng.com/api/voice/transfer";
    try{
        const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${autosyncApiKey}` },
            body: JSON.stringify({ request_ref: "REF_ORD_" + Date.now(), phone: phone, network: network.toLowerCase(), variation_code: selectedPlan.variation_code, plan_id: selectedPlan.plan_id, ported_no: false, pin: "2098" })
        });
        const result = await response.json();
        if(result.status === "ok" || result.success === true){
            const newBalance = currentBalance - cost;
            await client.from("users").update({ balance: newBalance }).eq("id", currentUser.id);
            await client.from("transactions").insert([{ user_id: currentUser.id, type: (currentServiceType === "data" ? "Data" : "Voice Bundle"), details: `${network} ${selectedPlan.name.split(' - ')[0]} to ${phone}`, amount: cost, status: "Success" }]);
            alert("Purchased successfully!");
            document.getElementById("transactionPin").value = ""; 
            loadUserData(currentUser.id); loadTransactions(currentUser.id);
        } else { alert(result.message || "Transaction failed"); }
    } catch(e) { alert("Network Error"); }
}

async function loadTransactions(userId){
    const { data } = await client.from("transactions").select("*").eq("user_id", userId).order("created_at", { ascending: false }).limit(10);
    const listDiv = document.getElementById("transactionList"); listDiv.innerHTML = "";
    if(!data || data.length === 0){ listDiv.innerHTML = `<div class="transactionItem" style="justify-content:center; border:none; color:#888;">No transactions yet</div>`; return; }
    data.forEach(tx => {
        const dateFormatted = new Date(tx.created_at).toLocaleString();
        listDiv.innerHTML += `<div class="transactionItem"><div class="txDetails"><span class="txType">${tx.type}</span><span class="txInfo">${tx.details}</span><span class="txDate">${dateFormatted}</span></div><div class="txAmount">-₦${Number(tx.amount).toLocaleString()}</div></div>`;
    });
}

async function logoutUser(){ await client.auth.signOut(); window.location.href = "/"; }
window.addEventListener("load", () => { checkUser(); changeDataPlans(); });
</script>
</body>

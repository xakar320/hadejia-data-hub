<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <style>
    body{
      font-family: Arial;
      background:#f2f2f2;
      padding:20px;
    }

    .box{
      background:white;
      padding:20px;
      border-radius:10px;
      max-width:400px;
      margin:auto;
      text-align:center;
    }

    button{
      padding:10px 20px;
      border:none;
      background:green;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    h2{
      color:green;
    }
  </style>
</head>
<body>

<div class="box">

  <h2>Welcome</h2>

  <p id="user-email">Loading...</p>

  <button onclick="logout()">
    Logout
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl = "https://zjenhfapfhuoogxorung.supabase.co/rest/v1/";

const supabaseKey = "sb_publishable_PsygV812Dm2ORo2JcnhjzA_I_xbjqG4";

const client = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

async function checkUser() {

  const {
    data: { user }
  } = await client.auth.getUser();

  // Protect Page
  if (!user) {

    window.location.href = "login.html";

  } else {

    // Show Email
    document.getElementById(
      "user-email"
    ).innerText = user.email;

  }

}

checkUser();


// Logout Function
async function logout() {

  await client.auth.signOut();

  window.location.href = "login.html";

}

</script>

</body>
</html>

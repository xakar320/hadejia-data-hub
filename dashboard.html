<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f1f1f1;
}

.box{
max-width:500px;
margin:50px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
text-align:center;
}

h1{
color:green;
}

.balance{
font-size:30px;
background:green;
color:white;
padding:15px;
border-radius:10px;
margin-top:20px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
background:red;
color:white;
font-size:20px;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1 id="welcomeText">Loading...</h1>

<div class="balance">₦0</div>

<button onclick="logout()">Logout</button>

</div>

<!-- 🔥 JS STARTS HERE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://zjenhfapfhuoogxorung.supabase.co";

const supabaseKey =
"sb_publishable_PsygV812Dm2ORo2JcnhjzA_I_xbjqG4";

const client =
supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;

/* CHECK USER */
async function checkUser(){

const { data:{session} } =
await client.auth.getSession();

if(!session){
window.location.href = "auth.html";
return;
}

currentUser = session.user;

document.getElementById("welcomeText").innerText =
"Welcome " + (currentUser.user_metadata.full_name || "User");

loadBalance();

}

/* LOAD BALANCE */
async function loadBalance(){

const { data } =
await client
.from("users")
.select("balance")
.eq("email", currentUser.email)
.single();

if(data){
document.querySelector(".balance").innerText =
"₦" + Number(data.balance).toLocaleString();
}

}

/* LOGOUT */
async function logout(){
await client.auth.signOut();
window.location.href = "auth.html";
}

checkUser();

</script>

</body>
</html>

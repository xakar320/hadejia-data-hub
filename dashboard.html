<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadejia Data Hub - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h2>📊 Dashboard</h2>

    <button onclick="logout()" class="logoutBtn">
        Logout
    </button>

    <button id="adminBtn" class="adminBtnStyle" style="display:none;" onclick="goAdmin()">
        Admin Panel
    </button>
</div>

<!-- PROFILE CARD -->
<div class="card">
    <h3>👤 Profile</h3>

    <p><b>Name:</b> <span id="fullName">Loading...</span></p>
    <p><b>Email:</b> <span id="email">Loading...</span></p>
    <p><b>Phone:</b> <span id="phone">Loading...</span></p>
</div>

<!-- WALLET -->
<div class="card">
    <h3>💰 Wallet Balance</h3>
    <h1 id="balance">₦0</h1>
</div>

<!-- QUICK ACTION -->
<div class="card">
    <h3>⚡ Quick Actions</h3>

    <button onclick="alert('Coming soon')">Buy Data</button>
    <button onclick="alert('Coming soon')">Buy Voice</button>
</div>

<!-- TRANSACTIONS -->
<div class="card">
    <h3>📜 Transactions</h3>
    <div id="transactions">
        Loading...
    </div>
</div>

<script src="js/dashboard.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hadejia Data Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f2f2f2;
}

.header{
background:green;
padding:40px 20px;
text-align:center;
color:white;
}

.header h1{
font-size:40px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card h2{
color:green;
margin-bottom:20px;
}

.balance{
font-size:60px;
font-weight:bold;
text-align:center;
color:green;
margin-top:40px;
}

input,
select{
width:100%;
padding:15px;
margin-top:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:18px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:10px;
background:green;
color:white;
font-size:20px;
cursor:pointer;
}

.logout{
background:red;
}

</style>
</head>
<body>

<div class="header">

<h1>Hadejia Data Hub</h1>

<p>Cheap & Fast VTU Services</p>

</div>

<div class="container">

<div class="card">

<h2>Wallet Balance</h2>

<div class="balance">
₦0
</div>

</div>


<div class="card">

<h2>Buy Data</h2>

<select id="network">

<option value="mtn">
MTN
</option>

<option value="airtel">
AIRTEL
</option>

<option value="glo">
GLO
</option>

<option value="9mobile">
9MOBILE
</option>

</select>


<input
type="text"
id="phone"
placeholder="Phone Number">


<input
type="text"
id="product_id"
placeholder="Product ID">


<input
type="text"
id="variation_code"
placeholder="Variation Code">


<button onclick="buyBundle()">
Buy Bundle
</button>

</div>


<div class="card">

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// SUPABASE
const supabaseUrl =
"https://zjenhfapfhuoogxorung.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZW5oZmFwZmh1b29neG9ydW5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTkwNjMsImV4cCI6MjA5NjM3NTA2M30.Jymmb6ZACaR5r0Q5pYSVJzJIkqhkmera-Q7jVXvmaX0";

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);


// PROTECT PAGE
async function checkUser(){

document.body.style.display = "none";

const {
data: { session }
} = await client.auth.getSession();

if(!session){

window.location.href = "/";

}else{

document.body.style.display = "block";

}

}

checkUser();



// BUY DATA
async function buyBundle(){

// CHECK LOGIN
const {
data: { session }
} = await client.auth.getSession();

if(!session){

alert("Please login first");

window.location.href = "/";

return;

}


// GET VALUES
const phone =
document.getElementById("phone").value;

const product_id =
document.getElementById("product_id").value;

const variation_code =
document.getElementById("variation_code").value;


// VALIDATION
if(!phone ||
!product_id ||
!variation_code){

alert("Fill all fields");

return;

}


try{

const response = await fetch(

"https://autosyncng.com/api/data/transfer",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer YOUR_AUTOSYNC_API_KEY"

},

body: JSON.stringify({

request_ref:
"REF_" + Date.now(),

phone: phone,

product_id:
product_id,

variation_code:
variation_code,

webhook_url:
"https://yourwebsite.com/webhook",

ported_no:false,

pin:"YOUR_PIN"

})

}

);

const result =
await response.json();

console.log(result);


// SUCCESS
if(result.status === "ok"){

alert(
"Bundle Purchased Successfully"
);

}

// FAILED
else{

alert(
result.message ||
"Purchase Failed"
);

}

}

catch(error){

console.log(error);

alert("Network Error");

}

}



// LOGOUT
async function logout(){

await client.auth.signOut();

window.location.href = "/";

}

</script>

</body>
</html>

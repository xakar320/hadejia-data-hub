<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>User Dashboard</title>

<style>

body{

margin:0;

padding:20px;

font-family:Arial,sans-serif;

background:#f1f1f1;

}

.box{

background:white;

padding:30px;

border-radius:20px;

max-width:500px;

margin:auto;

margin-top:50px;

box-shadow:0 5px 20px rgba(0,0,0,0.1);

}

h1{

color:green;

font-size:40px;

margin-bottom:20px;

text-align:center;

}

p{

font-size:22px;

margin-bottom:20px;

text-align:center;

}

.balance{

background:green;

color:white;

padding:20px;

border-radius:15px;

font-size:30px;

font-weight:bold;

text-align:center;

margin-top:20px;

}

button{

width:100%;

height:60px;

border:none;

border-radius:15px;

background:red;

color:white;

font-size:24px;

font-weight:bold;

cursor:pointer;

margin-top:30px;

}

</style>

</head>

<body>

<div class="box">

<h1>
Dashboard
</h1>

<p id="welcomeText">
Loading...
</p>

<div class="balance">
₦0
</div>

<button onclick="logout()">
Logout
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://zjenhfapfhuoogxorung.supabase.co";

const supabaseKey =
"sb_publishable_PsygV812Dm2ORo2JcnhjzA_I_xbjqG4";

const client =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

/* CHECK USER */

async function checkUser(){

const {
data:{session}
} =
await client.auth.getSession();

if(!session){

window.location.href =
"auth.html";

return;

}

/* SHOW USER */

const user =
session.user;

document.getElementById(
"welcomeText"
).innerHTML =

"Welcome, <b>" +
(user.user_metadata.full_name || "User")
+
"</b>";

}

checkUser();

/* LOGOUT */

async function logout(){

await client.auth.signOut();

window.location.href =
"auth.html";

}

</script>

</body>
</html>

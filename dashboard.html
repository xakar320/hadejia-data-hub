<style>

padding:0;

font-family:Arial,sans-serif;
}

body{
background:#f3f5f9;

}



/* =========================
HEADER
========================= */

.header{

background:linear-gradient(
135deg,
green,
limegreen
);

border-radius:25px;
color:white;
margin-bottom:20px;

}

.headerTop{

display:flex;
justify-content:space-between;

}

.logo{
font-size:30px;

}

.logoutBtn{

background:red;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
font-size:16px;
font-weight:bold;

}

.balanceBox{
margin-top:25px;
}

.balanceTitle{
font-size:18px;
opacity:0.9;
}

.balance{

font-size:45px;
font-weight:bold;
margin-top:8px;

}



/* =========================
SERVICE CARDS
========================= */

.services{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:20px;

}

.service{

background:white;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

}

.serviceIcon{
font-size:40px;
}

.service h3{
margin-top:10px;
color:green;
}



/* =========================
MAIN CARD
========================= */

.card{

background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

}

.cardTitle{

font-size:24px;
font-weight:bold;
color:green;
margin-bottom:15px;

}



/* =========================
INPUTS
========================= */

select,
input{

width:100%;
padding:15px;
border-radius:12px;
border:1px solid #ccc;
margin-top:12px;
font-size:16px;
outline:none;

}



/* =========================
BUTTONS
========================= */

.mainBtn{

width:100%;
padding:15px;
border:none;
border-radius:12px;

background:linear-gradient(
135deg,
green,
limegreen
);

color:white;
font-size:20px;
font-weight:bold;
margin-top:15px;
cursor:pointer;

}

.mainBtn:hover{
opacity:0.9;
}



/* =========================
TRANSACTION
========================= */

.transactionItem{

padding:15px;
background:#f9f9f9;
border-radius:12px;
margin-top:10px;

}



/* =========================
RESPONSIVE
========================= */

@media(max-width:700px){

.services{
grid-template-columns:1fr;
}

.balance{
font-size:35px;

</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cable TV — Hadejia Data Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/voice.css">
<link rel="stylesheet" href="css/nav.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B2540">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

<div class="topbar">
  <a href="dashboard.html">← Back</a>
  <h1>Cable TV</h1>
</div>

<div class="page">

  <div class="card balance-card">
    <div class="label">Wallet Balance</div>
    <div class="amount mono" id="wallet-balance">Loading…</div>
  </div>

  <div class="card">
    <div class="tabs" id="mode-tabs">
      <button data-mode="renew" class="active">Renew / Pay Bill</button>
      <button data-mode="change">Change Package</button>
    </div>

    <div class="field">
      <label>Provider</label>
      <div class="network-tabs" id="provider-tabs"></div>
    </div>

    <div class="field">
      <label for="iuc-input">Smartcard / IUC Number</label>
      <input type="text" id="iuc-input" placeholder="e.g. 1234567890" inputmode="numeric">
    </div>

    <!-- Renew mode -->
    <div id="renew-section">
      <div class="field">
        <label for="amount-input">Amount to Pay (₦)</label>
        <input type="number" id="amount-input" placeholder="Your outstanding balance">
      </div>
    </div>

    <!-- Change mode -->
    <div id="change-section" style="display:none;">
      <label class="plan-list-label">Choose a package</label>
      <div class="plan-list" id="package-list">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>

    <button class="btn btn-primary" id="buy-btn" disabled>Select a provider first</button>
  </div>

</div>

<div class="modal-backdrop" id="result-modal">
  <div class="modal" id="result-modal-content"></div>
</div>

<div id="toast-wrap"></div>

<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script src="js/pin-modal.js"></script>
<script src="js/cable.js"></script>
<script src="js/pwa-register.js"></script>
</body>
</html>
